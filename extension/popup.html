<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StepNotate</title>
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <div class="pop-head">
    <div class="brand">
      <span class="mark">
        <svg viewBox="0 0 128 128" aria-hidden="true">
          <rect width="128" height="128" rx="30" fill="#1b1f24"/>
          <path d="M29 96V55h22V35h22V15h26v81H29Z" fill="#faf8f3"/>
          <rect x="29" y="100" width="70" height="10" rx="5" fill="#d8482a"/>
        </svg>
      </span>
      <span class="wordmark">Step<em>Notate</em></span>
    </div>
    <button class="icon-btn" id="openLibrary" title="Open library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.4"/><rect x="14" y="3" width="7" height="7" rx="1.4"/><rect x="3" y="14" width="7" height="7" rx="1.4"/><rect x="14" y="14" width="7" height="7" rx="1.4"/>
      </svg>
    </button>
  </div>

  <div class="pop-body">
    <button class="action-card" id="pickFile">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 8.2A2.2 2.2 0 0 1 5.2 6h3.4l1.8 2.2h8.4A2.2 2.2 0 0 1 21 10.4v6.4A2.2 2.2 0 0 1 18.8 19H5.2A2.2 2.2 0 0 1 3 16.8V8.2Z"/>
        </svg>
      </span>
      <span class="action-text">
        <b>Open a file</b>
        <small>PDF or image from this computer</small>
      </span>
      <span class="action-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </button>

    <button class="action-card" id="toggleLink">
      <span class="action-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10.5 13.5a3.5 3.5 0 0 0 5 0l2.7-2.7a3.5 3.5 0 0 0-5-5L11.7 7"/>
          <path d="M13.5 10.5a3.5 3.5 0 0 0-5 0l-2.7 2.7a3.5 3.5 0 0 0 5 5l1.5-1.5"/>
        </svg>
      </span>
      <span class="action-text">
        <b>From a link</b>
        <small>Direct URL to a PDF or image</small>
      </span>
      <span class="action-arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
      </span>
    </button>

    <form class="link-row" id="linkForm" hidden>
      <input id="linkInput" type="text" placeholder="https://example.com/paper.pdf" spellcheck="false" autocomplete="off">
      <button class="btn btn-primary" type="submit">Open</button>
    </form>

    <div class="tab-card" id="tabCard" hidden>
      <div class="tab-label">
        <span class="live-dot"></span>
        This tab
      </div>
      <div class="tab-name" id="tabName"></div>
      <button class="btn btn-ghost tab-open" id="openTab">Open in StepNotate</button>
    </div>

    <div class="recent-head">
      <h2>Recent</h2>
      <button class="btn-quiet" id="viewAll">View all</button>
    </div>
    <div class="recent-list" id="recentList"></div>
    <p class="empty" id="recentEmpty">Nothing here yet. Documents you open stay on this device and show up in this list.</p>
  </div>

  <div class="pop-foot">
    <span class="foot-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
      Local only
    </span>
    <span class="foot-sep"></span>
    <span>Version 1.0.0</span>
  </div>

  <input type="file" id="fileInput" accept="application/pdf,image/*,.pdf,.png,.jpg,.jpeg,.webp,.gif,.bmp,.avif" hidden>
  <script type="module" src="js/popup.js"></script>
</body>
</html>
